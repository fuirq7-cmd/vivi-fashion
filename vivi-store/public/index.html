<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIVI FASHION</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mut:#777;--card:#f6f4f1;--line:#e4e0da;--acc:#111;--on:#fff;--gold:#b08d57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f3f0ea;--mut:#a29c93;--card:#1d1c1a;--line:#333;--acc:#f3f0ea;--on:#111;--lf:invert(1);--lb:screen}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f3f0ea;--mut:#a29c93;--card:#1d1c1a;--line:#333;--acc:#f3f0ea;--on:#111;--lf:invert(1);--lb:screen}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;min-height:100%}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px}
.logo{height:42px;cursor:pointer}.logo,.sp-logo{filter:var(--lf,none);mix-blend-mode:var(--lb,normal)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--on);border:0;padding:9px 18px;cursor:pointer;border-radius:2px;font-weight:600}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn.s{padding:5px 10px;font-size:13px}.btn.d{background:#b3261e;color:#fff}
.lang button{background:none;border:0;cursor:pointer;color:var(--mut);padding:4px 6px;font-weight:600}.lang .on{color:var(--fg);border-bottom:2px solid var(--gold)}
.hero{text-align:center;padding:64px 20px;background:var(--card)}
.hero h1{font-family:'Playfair Display','Cairo',serif;font-size:clamp(30px,6vw,56px);margin:0 0 10px;letter-spacing:.06em}
.hero p{color:var(--mut);margin:0 0 20px}
main{max-width:1150px;margin:0 auto;padding:24px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:none;padding:6px 16px;border-radius:30px;cursor:pointer}.chip.on{background:var(--acc);color:var(--on)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:2px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);padding-bottom:12px;transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}.img{aspect-ratio:3/4;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font:700 60px 'Playfair Display',serif;color:#fff8}
.card .in{padding:10px 12px}.pr{color:var(--gold);font-weight:700}.out{color:#b3261e;font-size:13px}
.ovl{position:fixed;inset:0;background:#0007;z-index:20;opacity:0;pointer-events:none;transition:opacity .35s}.ovl.on{opacity:1;pointer-events:auto}
.dr{transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1);position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);padding:18px;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.wrap{overflow-x:auto}.stat{background:var(--card);padding:18px;flex:1;min-width:140px}.stat b{font-size:28px;display:block}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.thumb{width:44px;height:56px;background-size:cover;background-position:center}
footer{text-align:center;color:var(--mut);padding:30px;border-top:1px solid var(--line);font-size:14px}footer a{cursor:pointer;text-decoration:underline}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.ok{background:var(--card);padding:16px;border-inline-start:3px solid var(--gold)}
[dir=rtl] .dr{transform:translateX(-100%)}.ovl.on .dr{transform:none}
.btn,.chip{transition:opacity .2s,transform .15s,background .2s}.btn:active{transform:scale(.97)}a.btn{text-decoration:none;display:inline-block}
.sec{border-bottom:1px solid var(--line);padding:14px 0}.sec h4{margin:0 0 10px;color:var(--mut);font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.an .hero,.an .chips,.an #q{animation:up .7s ease backwards}.an .card{animation:up .6s calc(var(--i)*70ms) ease backwards}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s;cursor:pointer}#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center;direction:ltr}.sp-logo{width:min(300px,70vw);opacity:0;transform:scale(.9);animation:spl 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
.sp-name{font:500 clamp(16px,4vw,22px) 'Playfair Display',serif;letter-spacing:.2em;padding-inline-start:.7em;opacity:0;animation:spn 1.4s ease .9s forwards}
.sp-line{height:1px;width:0;background:var(--gold);margin:16px auto;animation:spw 1.2s ease 1.2s forwards}.sp-tag{color:var(--mut);opacity:0;animation:spf 1s ease 1.8s forwards;font-size:14px}
@keyframes spl{to{opacity:1;transform:none}}@keyframes spn{to{opacity:1;letter-spacing:.7em}}@keyframes spw{to{width:120px}}@keyframes spf{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;scroll-behavior:auto!important}}
.dr{border-start-start-radius:22px;border-end-start-radius:22px}.ovl{backdrop-filter:blur(3px)}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:18px}.sh>div:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}.sh small{color:var(--mut)}
.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#b08d57,#6b5430);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px 'Playfair Display',serif;flex:none}
.cardx{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}.cardx h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut);transition:.25s}.seg button.on{background:var(--acc);color:var(--on);box-shadow:0 2px 8px #0003}
.soc{display:flex;gap:20px}.soc a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--fg);font-size:12px}.ic{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .25s}.soc a:hover .ic{transform:translateY(-3px) scale(1.06)}
.ic.ig{background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888)}.ic.wa{background:#25d366}
.sum>div{display:flex;justify-content:space-between;padding:4px 0}.sum .tt{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;margin-bottom:12px}
.adm{width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--acc);color:var(--on);padding:14px;border-radius:14px;cursor:pointer;font-weight:700;text-align:start}
</style></head><body>
<div id="splash"><div class="sp-in"><img class="sp-logo" alt="VIVI"><div class="sp-name">FASHION</div><div class="sp-line"></div><div class="sp-tag" id="sptag"></div></div></div>
<div id="app"></div>
<div class="ovl" id="ov"><div class="dr" id="dr"></div></div>
